<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F2FCF8"/>
      <stop offset="1" stop-color="#F2FCF8"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#66E2CA" stop-opacity="0.38"/>
      <stop offset="0.68" stop-color="#66E2CA" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#66E2CA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27C5AA"/>
      <stop offset="1" stop-color="#1FA58F"/>
    </linearGradient>
    <filter id="mascotShadow" x="-35%" y="-35%" width="170%" height="185%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#258D7A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <circle cx="512" cy="438" r="302" fill="none" stroke="#37CDB4" stroke-opacity="0.15" stroke-width="4"/>
  <circle cx="512" cy="438" r="238" fill="none" stroke="#37CDB4" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="14 20"/>
  <circle cx="512" cy="438" r="250" fill="url(#halo)"/>

  <circle cx="750" cy="288" r="17" fill="#3DD0B7" stroke="#FFFFFF" stroke-width="9"/>
  <circle cx="294" cy="642" r="12" fill="#7AE3CF" stroke="#FFFFFF" stroke-width="7"/>

  <image href="image/mascot-bird-splash.png" x="322" y="244" width="380" height="380" preserveAspectRatio="xMidYMid meet" filter="url(#mascotShadow)"/>

  <text x="512" y="790" text-anchor="middle" fill="url(#wordmark)" font-family="Arial Black, Arial, sans-serif" font-size="112" font-weight="900" letter-spacing="22">MINT</text>
  <rect x="430" y="824" width="164" height="8" rx="4" fill="#56D8C0" opacity="0.55"/>
</svg>
